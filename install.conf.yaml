- defaults:
    link:
      create: true
      relink: true

- clean: ['~', '~/.config']

- link:
    ~/.ssh/config: ssh/config
    ~/.config/nvim: nvim
    ~/.local/share/nvim/site/pack/packer/start: nvim/packer
    ~/.config/kitty/kitty.conf: term/kitty.conf
    ~/.alias: alias
    ~/.tmux: 
    ~/.tmux.conf: tmux/tmux.conf
    ~/.zshrc: zsh/zshrc
    ~/.zprofile: zsh/zprofile

- shell:
  - git submodule sync --recursive
  - git submodule update --init --recursive
