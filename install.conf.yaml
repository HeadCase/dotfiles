- defaults:
    link:
      create: true
      relink: true

- clean: ['~', '~/.config']

- link:
    ~/.config/nvim: nvim
    ~/.alias: alias
    ~/.zshrc: zsh/zshrc
    ~/.zshprofile: zsh/zprofile
    ~/.oh-my-zsh/themes/spaceship.zsh-theme: 

- shell:
  - git submodule sync --recursive
  - git submodule update --init --recursive
