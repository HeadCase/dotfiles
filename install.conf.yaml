- defaults:
    link:
      create: true
      relink: true

- clean: ['~', '~/.config']

- link:
    ~/.alias: alias
    ~/.config/kitty/kitty.conf: term/kitty.conf
    ~/.config/nvim: nvim
    ~/.config/zellij: zellij
    ~/.ssh/config: ssh/config
    ~/.tmux.conf: tmux/tmux.conf
    ~/.tmux: 
    ~/.oh-my-zsh/custom/plugins: zsh/plugins
    ~/.oh-my-zsh/custom/fast-syntax-highlighting: zsh/fast-syntax-highlighting/
    ~/.zprofile: zsh/zprofile
    ~/.zshenv: zsh/zshenv
    ~/.zshrc: zsh/zshrc

- shell:
  - git submodule sync --recursive
  - git submodule update --init --recursive
  - ssh-import-id-gh headcase
