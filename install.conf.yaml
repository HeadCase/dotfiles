- defaults:
    link:
      create: true
      relink: true

- clean: ['~', '~/.config']

- link:
    ~/.alias: alias
    ~/.config/bat: bat
    ~/.config/nvim: nvim
    ~/.config/zellij: zellij
    ~/.oh-my-zsh/custom/plugins/zsh-completions: zsh/plugins/zsh-completions
    ~/.oh-my-zsh/custom/plugins/zsh-autosuggestions: zsh/plugins/zsh-autosuggestions
    ~/.oh-my-zsh/custom/fast-syntax-highlighting: zsh/fast-syntax-highlighting/
    ~/.zprofile: zsh/zprofile
    ~/.zshenv: zsh/zshenv
    ~/.zshrc: zsh/zshrc

- shell:
  - git submodule sync --recursive
  - git submodule update --init --recursive
  - ssh-import-id-gh headcase
