- defaults:
    link:
      create: true
      relink: true

- clean: ['~', '~/.config']

- link:
    ~/.ssh/config: ssh/config
    ~/.ssh/bastion: keys/bastion
    ~/.config/nvim: nvim
    ~/.vim: nvim
    ~/.alias: alias
    ~/.tmux: 
    ~/.tmux.conf: tmux/tmux.conf
    ~/.zshrc: zsh/zshrc
    ~/.zshprofile: zsh/zprofile
    ~/.oh-my-zsh/themes/spaceship.zsh-theme: zsh/plugins/spaceship-prompt/spaceship.zsh

- shell:
  - git submodule sync --recursive
  - git submodule update --init --recursive
