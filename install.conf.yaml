- defaults:
    link:
      create: true
      relink: true

- clean: ['~', '~/.config']

- link:
    ~/.ssh/config: ssh/config
    ~/.config/nvim: nvim
    ~/.local/share/nvim/site/pack/packer/start: nvim/packer
    ~/.config/alacritty: term
    ~/.alias: alias
    ~/.tmux: 
    ~/.tmux.conf: tmux/tmux.conf
    ~/.zshrc: zsh/zshrc
    ~/.zprofile: zsh/zprofile
    ~/.oh-my-zsh/themes/spaceship.zsh-theme: zsh/plugins/spaceship-prompt/spaceship.zsh
    ~/.config/powerline: ~/.pyenv/versions/3.9.6/lib/python3.9/site-packages/powerline

- shell:
  - git submodule sync --recursive
  - git submodule update --init --recursive
